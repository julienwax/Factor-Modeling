apiVersion: v1
kind: PersistentVolume
metadata:
  name: factor-data-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/factor-data   # minikube mount target — see README
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: factor-data-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
